<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Organization ビューア</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #d9dbe0;
    --accent: #2f6fdb;
    --code-bg: #f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c;
      --panel: #1e2126;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --border: #32363d;
      --accent: #6ea8ff;
      --code-bg: #2a2e35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    line-height: 1.7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  .tabs button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tabs button.active { border-color: var(--accent); color: var(--accent); font-weight: bold; }
  .toolsw { padding: 8px 12px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  aside input {
    margin: 10px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  #list { overflow-y: auto; flex: 1; }
  details.folder > summary {
    cursor: pointer;
    padding: 5px 12px;
    font-size: 14px;
    font-weight: bold;
    list-style: none;
    user-select: none;
  }
  details.folder > summary::-webkit-details-marker { display: none; }
  details.folder > summary::before { content: "▸ "; color: var(--muted); }
  details.folder[open] > summary::before { content: "▾ "; }
  details.folder > summary:hover { background: var(--bg); }
  .children { padding-left: 14px; }
  .item {
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    border-left: 3px solid transparent;
  }
  .item:hover { background: var(--bg); }
  .item.active { border-left-color: var(--accent); background: var(--bg); }
  .item small { display: block; color: var(--muted); font-size: 11px; }
  #view { flex: 1; overflow-y: auto; padding: 24px 32px; min-width: 0; }
  #view article { max-width: 860px; margin: 0 auto; }
  #view h1, #view h2, #view h3 { line-height: 1.35; }
  #view h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #view h2 { font-size: 19px; margin-top: 28px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #view h3 { font-size: 16px; margin-top: 20px; }
  #view a { color: var(--accent); }
  #view code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
  #view pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow-x: auto; }
  #view pre code { background: none; padding: 0; }
  #view blockquote { margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--muted); }
  #view hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .log-day { margin-bottom: 20px; }
  .log-day h3 { margin-bottom: 6px; }
  .log-day div { font-family: Consolas, "Yu Gothic UI", monospace; font-size: 14px; padding: 2px 0; }
  .muted { color: var(--muted); }
  .card { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 20px 24px; margin-top: 12px; }
  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card .q { font-size: 18px; white-space: pre-wrap; }
  .card .a { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border); white-space: pre-wrap; }
  .card .a .ans { font-size: 18px; font-weight: bold; color: var(--accent); }
  .qnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .qnav button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
  }
  .qnav button:hover { border-color: var(--accent); color: var(--accent); }
  .qnav .count { color: var(--muted); font-size: 14px; }
  .qnav button.on { border-color: var(--accent); color: var(--accent); font-weight: bold; }

  /* IT・セキュリティニュースの記事風表示 */
  #view.wide article { max-width: 1120px; }
  .narticle { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 32px; margin-top: 8px; }
  .nmain { min-width: 0; }
  .ntoc { position: sticky; top: 0; align-self: start; max-height: calc(100vh - 120px); overflow-y: auto;
          font-size: 13px; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 12px 14px; }
  .ntoc-title { font-weight: bold; color: var(--muted); margin-bottom: 6px; }
  .ntoc ol { margin: 0; padding-left: 18px; }
  .ntoc li { margin: 4px 0; line-height: 1.5; }
  #view .ntoc a { color: var(--text); text-decoration: none; }
  #view .ntoc a:hover { color: var(--accent); }
  #news-open { margin-left: 16px; }
  .nitem { margin-top: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); scroll-margin-top: 12px; }
  .nitem > summary { cursor: pointer; list-style: none; }
  .nitem > summary::-webkit-details-marker { display: none; }
  #view .nitem h2.ntitle { margin: 0; padding: 0; border: none; font-size: 18px; }
  .nitem h2.ntitle::before { content: "▸ "; color: var(--muted); }
  .nitem[open] h2.ntitle::before { content: "▾ "; }
  .nitem-body { margin-top: 6px; }
  .ntags { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
  .tag { font-size: 12px; line-height: 1.7; padding: 0 9px; border-radius: 4px; background: var(--code-bg); color: var(--muted); }
  .tag.ok { color: var(--accent); }
  .sev-h { --sev: #c62828; }
  .sev-m { --sev: #b26a00; }
  .sev-l { --sev: #2e7d32; }
  .tag[class*="sev-"] { color: #fff; background: var(--sev); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--sev, transparent); }
  @media (max-width: 1100px) {
    .narticle { grid-template-columns: minmax(0, 1fr); }
    .ntoc { position: static; order: -1; max-height: 180px; }
  }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    aside { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    #view { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>AI-Organization ビューア</h1>
  <nav class="tabs">
    <button id="tab-notes" class="active">成果物</button>
    <button id="tab-tools">ツール</button>
    <button id="tab-docs">ヘルプ</button>
  </nav>
</header>
<main>
  <aside>
    <input id="search" type="search" placeholder="ファイル名・本文で検索">
    <div id="list"></div>
  </aside>
  <section id="view"><article id="content"></article></section>
</main>

<script>
(() => {
  "use strict";

  // ---- 補助 ----
  const $ = (sel) => document.querySelector(sel);

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // 行内記法（先にエスケープ済みの文字列に対して適用）
  function inline(s) {
    const stash = [];
    const keep = (html) => { stash.push(html); return `\u0000${stash.length - 1}\u0000`; };
    const link = (u, t) => keep(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
    s = s.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${c}</code>`));
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => link(u, t));
    // 書式なしの URL もリンクにする（空白や全角の句読点・括弧で終わる）
    s = s.replace(/https?:\/\/[^\s<>"'\]、。，）（()「」]+/g, (u) => link(u, u));
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[Number(i)]);
  }

  // 簡易Markdown描画（見出し・箇条書き・番号付き・引用・コード・水平線・段落）
  function renderMarkdown(md) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;
    let listType = null;
    const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };

    while (i < lines.length) {
      const raw = lines[i];
      const line = escapeHtml(raw);

      if (raw.startsWith("```")) {
        closeList();
        const code = [];
        i++;
        while (i < lines.length && !lines[i].startsWith("```")) {
          code.push(escapeHtml(lines[i]));
          i++;
        }
        out.push(`<pre><code>${code.join("\n")}</code></pre>`);
        i++;
        continue;
      }

      const h = raw.match(/^(#{1,3})\s+(.*)$/);
      if (h) {
        closeList();
        out.push(`<h${h[1].length}>${inline(escapeHtml(h[2]))}</h${h[1].length}>`);
        i++; continue;
      }

      if (/^(\*\s*){3,}$|^-{3,}\s*$/.test(raw.trim())) {
        closeList();
        out.push("<hr>");
        i++; continue;
      }

      const q = raw.match(/^>\s?(.*)$/);
      if (q) {
        closeList();
        out.push(`<blockquote>${inline(escapeHtml(q[1]))}</blockquote>`);
        i++; continue;
      }

      const ul = raw.match(/^(\s*)[-*]\s+(.*)$/);
      const ol = raw.match(/^(\s*)\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        const type = ul ? "ul" : "ol";
        const text = ul ? ul[2] : ol[2];
        if (listType !== type) { closeList(); out.push(`<${type}>`); listType = type; }
        out.push(`<li>${inline(escapeHtml(text))}</li>`);
        i++; continue;
      }

      if (raw.trim() === "") {
        closeList();
        i++; continue;
      }

      closeList();
      out.push(`<p>${inline(line)}</p>`);
      i++;
    }
    closeList();
    return out.join("\n");
  }

  async function getJson(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ---- 状態 ----
  let notes = [];
  let currentPath = null;
  let mode = "notes";
  const TOOLS = [["quiz", "一問一答"], ["worklog", "作業ログ"]];
  const isTool = (m) => TOOLS.some(([id]) => id === m);
  let lastTool = "quiz";  // ツールタブを開いたときに表示する機能（初期は一問一答）
  const QUESTION_DIR = "mentor/quiz/questions/";
  // 本文検索の結果（検索語 q に対するもの。path → 一致箇所の抜粋）
  let hits = { q: "", map: new Map() };
  let searchSeq = 0;
  let searchTimer = null;
  let docs = [];
  let currentDoc = null;
  let currentQuiz = null;
  let questions = [];
  let qIndex = 0;
  let qShown = false;

  // ---- 一覧（ツリー表示） ----
  // 開いているフォルダのキー（再描画しても開閉状態を保つ）
  const openFolders = new Set();

  // 先頭の8桁（yyyymmdd）から日付を取り出す。例: 20261120_xxx → 2026-11-20
  function dateOf(path) {
    for (const seg of path.split("/").reverse()) {
      const m = seg.match(/^(\d{4})(\d{2})(\d{2})/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    }
    return "";
  }

  // パスからツリーを作る。日付フォルダは階層に出さず、同じ親にまとめる
  function buildTree(list) {
    const root = { name: "", key: "", folders: new Map(), files: [] };
    for (const n of list) {
      const dirs = n.path.split("/").slice(0, -1).filter(p => !/^\d{8}/.test(p));
      let node = root;
      const ancestors = [];
      for (const d of dirs) {
        const key = node.key ? node.key + "/" + d : d;
        if (!node.folders.has(d)) node.folders.set(d, { name: d, key, folders: new Map(), files: [] });
        node = node.folders.get(d);
        ancestors.push(key);
      }
      n.ancestors = ancestors;
      node.files.push(n);
    }
    return root;
  }

  // 検索語に一致するファイルを、子孫に持つかどうか
  // n は { title, path } を持つ項目（成果物・ヘルプ共通）
  function matches(n, q) {
    if (!q) return true;
    if (hits.q === q && hits.map.has(n.path)) return true;
    return (n.title + " " + n.path).toLowerCase().includes(q);
  }
  function snippetOf(path, q) {
    return hits.q === q ? (hits.map.get(path) || "") : "";
  }

  // 一覧の1項目を作る（title の下に、小さい文字で meta と、あれば抜粋を出す）
  function makeItem(title, metas, active, onClick) {
    const item = document.createElement("div");
    item.className = "item" + (active ? " active" : "");
    item.innerHTML = escapeHtml(title) +
      metas.filter(Boolean).map(m => `<small>${escapeHtml(m)}</small>`).join("");
    item.addEventListener("click", onClick);
    return item;
  }

  // 検索語が変わったら、サーバーに本文検索を依頼して一覧を更新する
  function onSearchInput() {
    renderList();
    clearTimeout(searchTimer);
    const q = $("#search").value.trim().toLowerCase();
    if (!q) return;
    searchTimer = setTimeout(async () => {
      const seq = ++searchSeq;
      try {
        const data = await getJson(`/api/search?q=${encodeURIComponent(q)}`);
        if (seq !== searchSeq) return;
        hits = { q, map: new Map(data.map(x => [x.path, x.snippet])) };
        renderList();
      } catch (e) { /* 検索に失敗した場合は、タイトル・パスの絞り込みのみ */ }
    }, 250);
  }
  function hasMatch(node, q) {
    return node.files.some(f => matches(f, q)) ||
           [...node.folders.values()].some(f => hasMatch(f, q));
  }

  function renderNode(node, q, container) {
    const folders = [...node.folders.values()].sort((a, b) => a.name.localeCompare(b.name, "ja"));
    for (const folder of folders) {
      if (!hasMatch(folder, q)) continue;
      const det = document.createElement("details");
      det.className = "folder";
      det.open = q !== "" || openFolders.has(folder.key);
      const sum = document.createElement("summary");
      sum.textContent = folder.name;
      det.appendChild(sum);
      if (q === "") {
        det.addEventListener("toggle", () => {
          if (det.open) openFolders.add(folder.key); else openFolders.delete(folder.key);
        });
      }
      const children = document.createElement("div");
      children.className = "children";
      renderNode(folder, q, children);
      det.appendChild(children);
      container.appendChild(det);
    }

    const files = node.files
      .filter(f => matches(f, q))
      .sort((a, b) => a.name.localeCompare(b.name, "ja"));
    for (const n of files) {
      const meta = [dateOf(n.path), n.name].filter(Boolean).join(" · ");
      container.appendChild(makeItem(n.title, [meta, snippetOf(n.path, q)],
        n.path === currentPath, () => openNote(n.path)));
    }
  }

  function renderList() {
    const q = $("#search").value.trim().toLowerCase();
    const list = $("#list");
    list.innerHTML = "";

    if (isTool(mode)) {
      // ツールタブ：一問一答・作業ログの切り替えを一覧の先頭に出す
      const sw = document.createElement("div");
      sw.className = "tabs toolsw";
      for (const [id, label] of TOOLS) {
        const b = document.createElement("button");
        b.textContent = label;
        if (mode === id) b.className = "active";
        b.addEventListener("click", () => setMode(id));
        sw.appendChild(b);
      }
      list.appendChild(sw);
    }

    if (mode === "quiz") {
      $("#search").style.display = "none";
      const sets = notes.filter(n => n.path.startsWith(QUESTION_DIR))
        .sort((a, b) => b.name.localeCompare(a.name, "ja"));
      if (sets.length === 0) {
        list.insertAdjacentHTML("beforeend", '<div class="muted" style="padding:12px">問題集がありません。/mentor-question で作成してください。</div>');
        return;
      }
      for (const n of sets) {
        list.appendChild(makeItem(n.title, [[dateOf(n.path), n.name].filter(Boolean).join(" · ")],
          n.path === currentQuiz, () => openQuiz(n.path)));
      }
      return;
    }

    if (mode === "docs") {
      $("#search").style.display = "";
      const shown = docs.filter(d => matches(d, q));
      if (shown.length === 0) {
        list.innerHTML = '<div class="muted" style="padding:12px">該当するファイルがありません。</div>';
        return;
      }
      for (const d of shown) {
        list.appendChild(makeItem(d.title, [d.path, snippetOf(d.path, q)],
          d.path === currentDoc, () => openDoc(d.path)));
      }
      return;
    }

    if (mode === "worklog") {
      $("#search").style.display = "none";
      list.insertAdjacentHTML("beforeend", '<div class="muted" style="padding:12px">右側に作業ログを表示しています。</div>');
      return;
    }
    $("#search").style.display = "";

    const tree = buildTree(notes);
    if (!hasMatch(tree, q)) {
      list.innerHTML = '<div class="muted" style="padding:12px">該当するファイルがありません。</div>';
      return;
    }
    renderNode(tree, q, list);
  }

  // ---- IT・セキュリティニュース（記事風の表示） ----
  // 成果物の形式（research-it-news の SKILL.md）に沿って md を読み取る
  const isNewsPath = (p) => /_it-news\/topic_summary\.md$/.test(p);
  const SEV_RANK = { "高": 0, "中": 1, "低": 2 };
  const SEV_CLASS = { "高": "h", "中": "m", "低": "l" };
  let newsView = "card";   // "card" | "raw"
  let newsOpen = new Set();   // 展開中の項目（index）
  let news = null;

  function parseNews(md) {
    const head = [], tail = [], items = [];
    let area = "head", status = "", cur = null;
    for (const line of md.replace(/\r\n/g, "\n").split("\n")) {
      const h2 = line.match(/^##\s+(.*)$/);
      if (h2) {
        cur = null;
        if (area === "skip") area = "head";
        if (/^見出し一覧/.test(h2[1])) { area = "skip"; continue; }
        if (/^確認済み/.test(h2[1])) { area = "items"; status = "confirmed"; continue; }
        if (/^未確認/.test(h2[1])) { area = "items"; status = "unconfirmed"; continue; }
        if (area === "items") area = "tail";
      }
      const h3 = area === "items" && line.match(/^###\s+(.*)$/);
      if (h3) {
        cur = { title: h3[1].replace(/^\d+\.\s*/, ""), status, lines: [], index: items.length };
        items.push(cur);
      } else if (area === "items") {
        if (cur) cur.lines.push(line); else if (line.trim()) head.push(line);
      } else if (area !== "skip") {
        (area === "head" ? head : tail).push(line);
      }
    }
    for (const it of items) {
      const body = [];
      for (const l of it.lines) {
        const m = l.match(/^-\s*(重要度|カテゴリ)\s*[:：]\s*(.+?)\s*$/);
        if (!m) body.push(l);
        else if (m[1] === "重要度") it.sev = m[2].charAt(0);
        else it.cat = m[2];
      }
      if (!(it.sev in SEV_RANK)) it.sev = "";
      it.cat = it.cat || "";
      it.body = body.join("\n");
      const dates = it.lines.join("\n").match(/\d{4}-\d{2}-\d{2}/g);
      it.date = dates ? dates.sort().pop() : "";
    }
    return { head: head.join("\n"), tail: tail.join("\n"), items, md };
  }

  // 記事の1項目。見出しとタグは常に見え、本文は展開・縮小できる
  function newsItemHtml(it) {
    const tags = [];
    if (it.sev) tags.push(`<span class="tag sev-${SEV_CLASS[it.sev]}">重要度 ${it.sev}</span>`);
    if (it.cat) tags.push(`<span class="tag">${escapeHtml(it.cat)}</span>`);
    tags.push(it.status === "confirmed"
      ? '<span class="tag ok">確認済み</span>'
      : '<span class="tag">未確認・続報待ち</span>');
    if (it.date) tags.push(`<span class="tag">${it.date}</span>`);
    return `<details class="nitem" id="nitem-${it.index}" data-index="${it.index}"${newsOpen.has(it.index) ? " open" : ""}>` +
      `<summary><h2 class="ntitle">${it.index + 1}. ${inline(escapeHtml(it.title))}</h2>` +
      `<div class="ntags">${tags.join("")}</div></summary>` +
      `<div class="nitem-body">${renderMarkdown(it.body)}</div></details>`;
  }

  function setAllNews(open) {
    newsOpen = open ? new Set(news.items.map(i => i.index)) : new Set();
    for (const d of document.querySelectorAll("details.nitem")) d.open = open;
  }

  // 目次から移動する。縮小されている項目は、展開してから移動する
  function jumpToNews(index) {
    const d = document.getElementById(`nitem-${index}`);
    if (!d) return;
    d.open = true;
    d.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderNews() {
    const viewBtn = (v, label) =>
      `<button data-view="${v}"${newsView === v ? ' class="on"' : ""}>${label}</button>`;
    const isCard = newsView === "card";
    const toggle = `<div class="qnav">${viewBtn("card", "記事")}${viewBtn("raw", "原文")}` +
      (isCard ? `<button id="news-open">すべて展開</button><button id="news-close">すべて縮小</button>` +
                `<span class="count">${news.items.length} 件</span>` : "") +
      `</div>`;
    if (!isCard) {
      $("#content").innerHTML = toggle + renderMarkdown(news.md);
    } else {
      const toc = news.items.map(it =>
        `<li><a href="#nitem-${it.index}" data-index="${it.index}">` +
        (it.sev ? `<span class="dot sev-${SEV_CLASS[it.sev]}"></span>` : "") +
        `${escapeHtml(it.title)}</a></li>`).join("");
      $("#content").innerHTML = toggle + `<div class="narticle"><div class="nmain">` +
        (news.head.trim() ? renderMarkdown(news.head) : "") +
        news.items.map(newsItemHtml).join("") +
        (news.tail.trim() ? renderMarkdown(news.tail) : "") +
        `</div><nav class="ntoc"><div class="ntoc-title">目次</div><ol>${toc}</ol></nav></div>`;
      $("#news-open").addEventListener("click", () => setAllNews(true));
      $("#news-close").addEventListener("click", () => setAllNews(false));
      for (const a of document.querySelectorAll(".ntoc a")) {
        a.addEventListener("click", (e) => { e.preventDefault(); jumpToNews(Number(a.dataset.index)); });
      }
      for (const d of document.querySelectorAll("details.nitem")) {
        d.addEventListener("toggle", () => {
          const i = Number(d.dataset.index);
          if (d.open) newsOpen.add(i); else newsOpen.delete(i);
        });
      }
    }
    for (const b of document.querySelectorAll("#content .qnav button[data-view]")) {
      b.addEventListener("click", () => { newsView = b.dataset.view; renderNews(); });
    }
  }

  // 成果物の表示。IT・セキュリティニュースは記事風の表示にする
  function showNote(path, md) {
    $("#view").classList.toggle("wide", isNewsPath(path));
    if (!isNewsPath(path)) { $("#content").innerHTML = renderMarkdown(md); return; }
    news = parseNews(md);
    // 最初は、確認済みを展開し、未確認・続報待ちを縮小する
    newsOpen = new Set(news.items.filter(i => i.status === "confirmed").map(i => i.index));
    renderNews();
  }

  // ---- 表示 ----
  async function openNote(path) {
    currentPath = path;
    // 選んだファイルが見えるよう、その親フォルダを開く
    const note = notes.find(n => n.path === path);
    if (note && note.ancestors) note.ancestors.forEach(k => openFolders.add(k));
    renderList();
    const content = $("#content");
    try {
      const data = await getJson(`/api/note?path=${encodeURIComponent(path)}`);
      showNote(path, data.content);
    } catch (e) {
      content.innerHTML = `<p class="muted">読み込みに失敗しました: ${escapeHtml(e.message)}</p>`;
    }
    $("#view").scrollTop = 0;
  }

  async function openDoc(path) {
    currentDoc = path;
    renderList();
    try {
      const data = await getJson(`/api/doc?path=${encodeURIComponent(path)}`);
      $("#content").innerHTML = renderMarkdown(data.content);
    } catch (e) {
      $("#content").innerHTML = `<p class="muted">読み込みに失敗しました: ${escapeHtml(e.message)}</p>`;
    }
    $("#view").scrollTop = 0;
  }

  async function showWorklog() {
    const content = $("#content");
    try {
      const logs = await getJson("/api/worklog");
      if (logs.length === 0) {
        content.innerHTML = '<p class="muted">作業ログがありません。</p>';
        return;
      }
      content.innerHTML = logs.map(l =>
        `<section class="log-day"><h3>${escapeHtml(l.file)}</h3>` +
        l.lines.map(x => `<div>${escapeHtml(x)}</div>`).join("") +
        `</section>`
      ).join("");
    } catch (e) {
      content.innerHTML = `<p class="muted">読み込みに失敗しました: ${escapeHtml(e.message)}</p>`;
    }
  }

  // ---- 一問一答 ----
  // 「### 問N」で分割し、「- 問題:」「- 答え:」「- 解説:」「- 出典:」を読み取る
  function parseQuestions(md) {
    const blocks = md.replace(/\r\n/g, "\n").split(/^###\s+/m).slice(1);
    const keys = { "問題": "q", "答え": "a", "解説": "e", "出典": "s" };
    const result = [];
    for (const block of blocks) {
      const lines = block.split("\n");
      const item = { title: lines[0].trim(), q: "", a: "", e: "", s: "" };
      let cur = null;
      for (const line of lines.slice(1)) {
        const m = line.match(/^-\s*(問題|答え|解説|出典)\s*[:：]\s*(.*)$/);
        if (m) { cur = keys[m[1]]; item[cur] = m[2]; }
        else if (cur && /^\s+\S/.test(line)) item[cur] += "\n" + line.trim();
        else if (line.trim() === "") { /* 空行は無視 */ }
        else cur = null;
      }
      if (item.q && item.a) result.push(item);
    }
    return result;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function renderCard() {
    const content = $("#content");
    if (questions.length === 0) {
      content.innerHTML = '<p class="muted">問題を読み取れませんでした。形式は /mentor-question の SKILL.md を参照してください。</p>';
      return;
    }
    const q = questions[qIndex];
    let html = `<div class="qnav"><span class="count">${qIndex + 1} / ${questions.length}</span></div>` +
      `<div class="card"><div class="label">${escapeHtml(q.title)}</div>` +
      `<div class="q">${inline(escapeHtml(q.q))}</div>`;
    if (qShown) {
      html += `<div class="a"><div class="label">答え</div><div class="ans">${inline(escapeHtml(q.a))}</div>`;
      if (q.e) html += `<div class="label" style="margin-top:12px">解説</div><div>${inline(escapeHtml(q.e))}</div>`;
      if (q.s) html += `<div class="label" style="margin-top:12px">出典</div><div class="muted">${escapeHtml(q.s)}</div>`;
      html += `</div>`;
    }
    html += `</div><div class="qnav">` +
      `<button id="q-prev">前へ</button>` +
      `<button id="q-toggle">${qShown ? "答えを隠す" : "答えを見る"}</button>` +
      `<button id="q-next">次へ</button>` +
      `<button id="q-shuffle">シャッフル</button></div>`;
    content.innerHTML = html;
    $("#q-prev").addEventListener("click", () => moveQuestion(-1));
    $("#q-next").addEventListener("click", () => moveQuestion(1));
    $("#q-toggle").addEventListener("click", () => { qShown = !qShown; renderCard(); });
    $("#q-shuffle").addEventListener("click", () => { shuffle(questions); qIndex = 0; qShown = false; renderCard(); });
  }

  function moveQuestion(d) {
    const n = questions.length;
    qIndex = (qIndex + d + n) % n;
    qShown = false;
    renderCard();
  }

  async function openQuiz(path) {
    currentQuiz = path;
    renderList();
    try {
      const data = await getJson(`/api/note?path=${encodeURIComponent(path)}`);
      questions = parseQuestions(data.content);
      qIndex = 0;
      qShown = false;
      renderCard();
    } catch (e) {
      $("#content").innerHTML = `<p class="muted">読み込みに失敗しました: ${escapeHtml(e.message)}</p>`;
    }
  }

  document.addEventListener("keydown", (e) => {
    if (mode !== "quiz" || questions.length === 0) return;
    if (e.key === "ArrowRight") moveQuestion(1);
    else if (e.key === "ArrowLeft") moveQuestion(-1);
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); qShown = !qShown; renderCard(); }
  });

  function setMode(next) {
    mode = next;
    $("#view").classList.remove("wide");
    if (isTool(next)) lastTool = next;
    $("#tab-notes").classList.toggle("active", next === "notes");
    $("#tab-tools").classList.toggle("active", isTool(next));
    $("#tab-docs").classList.toggle("active", next === "docs");
    renderList();
    if (next === "docs") {
      if (currentDoc) openDoc(currentDoc);
      else $("#content").innerHTML = '<p class="muted">左の一覧からファイルを選んでください。</p>';
    } else if (next === "quiz") {
      if (currentQuiz) openQuiz(currentQuiz);
      else $("#content").innerHTML = '<p class="muted">左の一覧から問題集を選んでください。</p>';
    } else if (next === "worklog") {
      currentPath = null;
      showWorklog();
    } else if (currentPath) {
      openNote(currentPath);
    } else {
      $("#content").innerHTML = '<p class="muted">左の一覧からファイルを選んでください。</p>';
    }
  }

  // ---- 初期化 ----
  $("#search").addEventListener("input", onSearchInput);
  $("#tab-notes").addEventListener("click", () => setMode("notes"));
  $("#tab-tools").addEventListener("click", () => setMode(lastTool));
  $("#tab-docs").addEventListener("click", () => setMode("docs"));

  getJson("/api/docs").then(data => { docs = data; if (mode === "docs") renderList(); }).catch(() => {});

  getJson("/api/notes")
    .then(data => { notes = data; renderList(); })
    .catch(e => {
      $("#list").innerHTML = `<div class="muted" style="padding:12px">一覧の取得に失敗しました: ${escapeHtml(e.message)}</div>`;
    });
  $("#content").innerHTML = '<p class="muted">左の一覧からファイルを選んでください。</p>';
})();
</script>
</body>
</html>
